name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name meatla_browser .
      - run: sed -i 's#minSdkVersion .*#minSdkVersion 21#' android/app/build.gradle || true
      - run: sed -i 's#minSdk .*#minSdk 21#' android/app/build.gradle.kts || true
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: meatla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
